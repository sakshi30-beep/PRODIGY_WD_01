<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Navigation Website</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVIGATION MENU -->
<nav id="navbar">
    <ul>
        <li><a href="#home" class="nav-link">Home</a></li>
        <li><a href="#about" class="nav-link">About</a></li>
        <li><a href="#services" class="nav-link">Services</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
    </ul>
</nav>

<!-- HOME SECTION -->
<section id="home" class="page">
    <h1>Welcome to the Interactive Website</h1>
    <p>Scroll or click on the menu to explore!</p>
    <button class="btn">Learn More</button>
</section>

<!-- ABOUT SECTION -->
<section id="about" class="page">
    <h1>About Us</h1>
    <p>We create creative & interactive web designs.</p>
    <div class="card">Hover Me!</div>
</section>

<!-- SERVICES SECTION -->
<section id="services" class="page">
    <h1>Our Services</h1>
    <div class="services-container">
        <div class="service-box">Web Design</div>
        <div class="service-box">Development</div>
        <div class="service-box">UI/UX</div>
    </div>
</section>

<!-- CONTACT SECTION -->
<section id="contact" class="page">
    <h1>Contact Us</h1>
    <form>
        <div style="display: flex; gap: 20px; justify-content: center; flex-direction: column; margin-top: 10px;">
            <div>
        <input type="text" placeholder="Your Name">
        </div>
        <div>
        <input type="email" placeholder="Email">
        </div>
        <div>
        <textarea placeholder="Message"style="width: 17L0px; height: 20px;"></textarea>
        </div>
        <div>
        <button class="btn">Send Message</button>
        </div>
        </div>
    </form>
</section>

<script src="script.js"></script>
</body>
</html>
